

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Email/SMS Spam Classifier</title>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      text-align: center;
      width: 600px;
      max-width: 90vw;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2rem;
      font-weight: bold;
    }

    textarea {
      width: 100%;
      height: 150px;
      padding: 15px;
      border: 2px solid #003153;
      background-color: white;
      color: black;
      margin-bottom: 15px;
      border-radius: 8px;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      font-size: 1.1rem;
      resize: vertical;
      box-sizing: border-box;
    }

    button {
      padding: 12px 24px;
      border: none;
      background-color: #003153;
      color: white;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1rem;
      border-radius: 6px;
      transition: background-color 0.3s ease;
      width: 100%;
    }

    button:hover,
    button:focus {
      background-color: #0052a3;
      outline: none;
    }

    #result {
      font-weight: bold;
      margin-top: 20px;
      color: white;
      min-height: 1.5em;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Email/SMS Spam Classifier</h1>

    <form action="/predict" method="post" id="spamForm">
      <textarea id="message-box" name="message" placeholder="Write your message here..."></textarea><br />
      <button type="submit">Check Spam</button>
    </form>

    <div id="result">
      {% if prediction_text %}
        {{ prediction_text }}
      {% endif %}
    </div>
  </div>

</body>
</html>
